<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Horizon Rush</title><style>html,body{margin:0;height:100%;overflow:hidden;background:#08130b;font-family:Arial,sans-serif;touch-action:none}canvas{display:block}#hud{position:fixed;inset:0;color:white;text-shadow:0 2px 5px #000;pointer-events:none}#title{position:absolute;top:14px;left:16px;font-size:24px;font-weight:900;letter-spacing:2px}#stats{position:absolute;top:12px;right:16px;text-align:right;font-size:13px}#speed{font-size:34px;font-weight:900}#controls{position:absolute;bottom:20px;left:0;right:0;display:flex;justify-content:space-between;padding:0 20px}.pad{display:flex;gap:10px}button{pointer-events:auto;width:64px;height:64px;border:1px solid #fff6;border-radius:18px;background:#ffffff22;color:#fff;font-size:27px;backdrop-filter:blur(8px)}#hint{position:absolute;bottom:5px;left:50%;transform:translateX(-50%);font-size:11px;opacity:.7;white-space:nowrap}</style></head><body><div id="hud"><div id="title">HORIZON RUSH</div><div id="stats"><div id="speed">0</div>KM/H<br><span id="gear">GEAR 1</span></div><div id="controls"><div class="pad"><button id="left">◀</button><button id="right">▶</button></div><div class="pad"><button id="brake">▼</button><button id="gas">▲</button></div></div><div id="hint">WASD / Arrows • Touch • Gamepad • Drag to look</div></div><script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js';
const scene=new THREE.Scene();scene.background=new THREE.Color(0x9bc8d9);scene.fog=new THREE.FogExp2(0x9bc8d9,.009);
const camera=new THREE.PerspectiveCamera(62,innerWidth/innerHeight,.1,900);const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,1.6));renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.15;document.body.prepend(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xdff5ff,0x25391f,2.1));const sun=new THREE.DirectionalLight(0xffefd0,3);sun.position.set(-120,180,80);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);sun.shadow.camera.left=-260;sun.shadow.camera.right=260;sun.shadow.camera.top=260;sun.shadow.camera.bottom=-260;scene.add(sun);
const terrain=new THREE.Mesh(new THREE.PlaneGeometry(520,520,80,80),new THREE.MeshStandardMaterial({color:0x315e35,roughness:.98}));terrain.rotation.x=-Math.PI/2;terrain.receiveShadow=true;scene.add(terrain);
const roadCurve=new THREE.CatmullRomCurve3([new THREE.Vector3(-170,0,-150),new THREE.Vector3(-80,0,-185),new THREE.Vector3(35,0,-155),new THREE.Vector3(155,0,-80),new THREE.Vector3(145,0,30),new THREE.Vector3(75,0,150),new THREE.Vector3(-40,0,175),new THREE.Vector3(-150,0,105),new THREE.Vector3(-190,0,-5)],true,'catmullrom',.25);const pts=roadCurve.getSpacedPoints(300),verts=[],idx=[];for(let i=0;i<pts.length;i++){const p=pts[i],n=pts[(i+1)%pts.length],d=n.clone().sub(p).normalize(),s=new THREE.Vector3(-d.z,0,d.x);for(const x of[-7,7]){const q=p.clone().add(s.multiplyScalar(x));q.y=.06;verts.push(q.x,q.y,q.z)}}for(let i=0;i<pts.length-1;i++){let a=i*2;idx.push(a,a+1,a+2,a+1,a+3,a+2)}const rg=new THREE.BufferGeometry();rg.setAttribute('position',new THREE.Float32BufferAttribute(verts,3));rg.setIndex(idx);rg.computeVertexNormals();const road=new THREE.Mesh(rg,new THREE.MeshStandardMaterial({color:0x25282a,roughness:.9}));road.receiveShadow=true;scene.add(road);
for(let i=0;i<pts.length;i+=5){const p=pts[i],n=pts[(i+1)%pts.length],d=n.clone().sub(p).normalize();const m=new THREE.Mesh(new THREE.BoxGeometry(.16,.035,3),new THREE.MeshStandardMaterial({color:0xe5dba0}));m.position.set(p.x,.12,p.z);m.rotation.y=Math.atan2(d.x,d.z);scene.add(m)}
function tree(x,z,s){const g=new THREE.Group();g.position.set(x,0,z);const t=new THREE.Mesh(new THREE.CylinderGeometry(.22*s,.42*s,4*s,8),new THREE.MeshStandardMaterial({color:0x533822,roughness:1}));t.position.y=2*s;t.castShadow=true;g.add(t);for(let i=0;i<4;i++){const c=new THREE.Mesh(new THREE.ConeGeometry((2.2-i*.25)*s,3.5*s,10),new THREE.MeshStandardMaterial({color:0x173f25,roughness:.98}));c.position.y=(4+i*1.15)*s;c.castShadow=true;g.add(c)}scene.add(g)}function nearRoad(x,z){for(const p of pts)if((p.x-x)**2+(p.z-z)**2<400)return true;return false}for(let i=0;i<900;i++){const x=(Math.random()-.5)*480,z=(Math.random()-.5)*480;if(!nearRoad(x,z))tree(x,z,.7+Math.random()*1.5)}for(let i=0;i<180;i++){const r=new THREE.Mesh(new THREE.IcosahedronGeometry(.5+Math.random()*2,1),new THREE.MeshStandardMaterial({color:0x555950,roughness:1}));r.position.set((Math.random()-.5)*480,.5,(Math.random()-.5)*480);r.scale.y=.5;r.castShadow=true;scene.add(r)}
const car=new THREE.Group();const body=new THREE.Mesh(new THREE.BoxGeometry(2.15,.58,4.35),new THREE.MeshPhysicalMaterial({color:0x1565c0,metalness:.72,roughness:.22,clearcoat:.8,clearcoatRoughness:.14}));body.position.y=1;body.castShadow=true;car.add(body);const cabin=new THREE.Mesh(new THREE.BoxGeometry(1.72,.65,1.9),new THREE.MeshPhysicalMaterial({color:0x11161b,metalness:.2,roughness:.07}));cabin.position.set(0,1.45,-.15);cabin.castShadow=true;car.add(cabin);for(const x of[-1.06,1.06])for(const z of[-1.48,1.48]){const w=new THREE.Mesh(new THREE.CylinderGeometry(.43,.43,.32,20),new THREE.MeshStandardMaterial({color:0x070707,roughness:.8}));w.rotation.z=Math.PI/2;w.position.set(x,.52,z);w.castShadow=true;car.add(w)}scene.add(car);
const keys={};addEventListener('keydown',e=>keys[e.key.toLowerCase()]=true);addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);function bind(id,key){const b=document.getElementById(id);b.onpointerdown=e=>{e.preventDefault();keys[key]=true};b.onpointerup=b.onpointercancel=b.onpointerleave=()=>keys[key]=false}bind('left','a');bind('right','d');bind('gas','w');bind('brake','s');function gamepad(){const p=[...(navigator.getGamepads?navigator.getGamepads():[])].find(Boolean);return p?{x:p.axes[0]||0,y:-(p.axes[1]||0)}:{x:0,y:0}}let dragging=false,lastX=0,lookX=0;renderer.domElement.onpointerdown=e=>{dragging=true;lastX=e.clientX};renderer.domElement.onpointerup=()=>dragging=false;renderer.domElement.onpointermove=e=>{if(dragging){lookX+=(e.clientX-lastX)*.004;lastX=e.clientX}};
let speed=0,yaw=0,steer=0;const clock=new THREE.Clock();function loop(){requestAnimationFrame(loop);const dt=Math.min(clock.getDelta(),.033),gp=gamepad(),gas=keys.w||keys.arrowup||gp.y>.25,brake=keys.s||keys.arrowdown||gp.y<-.25,L=keys.a||keys.arrowleft||gp.x<-.2,R=keys.d||keys.arrowright||gp.x>.2;if(gas)speed+=23*dt;if(brake)speed-=35*dt;speed-=speed*(gas?.012:.06);speed=Math.max(-9,Math.min(58,speed));const target=(R?1:0)-(L?1:0);steer+=(target-steer)*Math.min(1,dt*8);yaw-=steer*(.85+Math.abs(speed)/60)*dt;car.rotation.y=yaw;car.position.x+=Math.sin(yaw)*speed*dt;car.position.z+=Math.cos(yaw)*speed*dt;const desired=new THREE.Vector3(car.position.x-Math.sin(yaw+lookX)*10,5.2,car.position.z-Math.cos(yaw+lookX)*10);camera.position.lerp(desired,1-Math.pow(.001,dt));camera.lookAt(car.position.x,1,car.position.z);document.getElementById('speed').textContent=Math.round(Math.abs(speed)*3.6);document.getElementById('gear').textContent='GEAR '+Math.max(1,Math.min(6,Math.floor(Math.abs(speed)/9)+1));renderer.render(scene,camera)}addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});loop();
</script></body></html>
